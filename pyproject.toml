[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eli-lab-pattern-generator"
version = "2.3.0"
description = "eli_lab procedural composition generator for raster and SVG artwork"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ilya Minin (Eli)" }]
dependencies = [
  "Pillow>=11.0",
  "PySide6>=6.10",
  "opensimplex>=0.4",
]

[project.scripts]
eli-pattern-generator = "pattern_app.main:main"

[tool.setuptools]
packages = ["pattern_app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
